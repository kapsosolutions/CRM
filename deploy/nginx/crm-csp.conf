# Content-Security-Policy for the app page (index.html). Only the page needs
# it; it then applies to every script, style, image, frame and request the
# page makes. Generated from .agents/tasks/prod-hardening/headers.mjs.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://connect.facebook.net https://checkout.razorpay.com https://*.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src 'self' blob: data: https:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://api.razorpay.com; frame-ancestors 'self'" always;
