# Security headers for every response (pages, files, API).
# Included in the server block AND in every location that has its own
# add_header (nginx drops the server-level ones there otherwise).
# Generated from .agents/tasks/prod-hardening/headers.mjs — edit there.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(self \"https://api.razorpay.com\" \"https://checkout.razorpay.com\"), usb=(), serial=(), bluetooth=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
