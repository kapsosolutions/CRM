<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Instagram direct messages arriving in the CRM inbox">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#feda75"/>
      <stop offset="0.28" stop-color="#fa7e1e"/>
      <stop offset="0.55" stop-color="#d62976"/>
      <stop offset="0.8" stop-color="#962fbf"/>
      <stop offset="1" stop-color="#4f5bd5"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#feda75"/>
      <stop offset="0.45" stop-color="#fa7e1e"/>
      <stop offset="0.75" stop-color="#d62976"/>
      <stop offset="1" stop-color="#962fbf"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d62976"/>
      <stop offset="1" stop-color="#962fbf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#3b0d3f" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <circle cx="90" cy="40" r="140" fill="#ffffff" opacity="0.10"/>
  <circle cx="1130" cy="380" r="180" fill="#ffffff" opacity="0.09"/>
  <circle cx="610" cy="-40" r="120" fill="#ffffff" opacity="0.07"/>
  <circle cx="560" cy="360" r="60" fill="#ffffff" opacity="0.08"/>

  <!-- Direct message thread -->
  <g filter="url(#shadow)">
    <rect x="150" y="62" width="330" height="276" rx="26" fill="#ffffff"/>
  </g>
  <circle cx="196" cy="108" r="21" fill="none" stroke="url(#ring)" stroke-width="4"/>
  <circle cx="196" cy="108" r="15" fill="#f3e8ff"/>
  <rect x="230" y="96" width="120" height="11" rx="5.5" fill="#1f2937" opacity="0.85"/>
  <rect x="230" y="114" width="78" height="9" rx="4.5" fill="#9ca3af" opacity="0.7"/>
  <line x1="172" y1="146" x2="458" y2="146" stroke="#f1f5f9" stroke-width="2"/>
  <rect x="172" y="164" width="200" height="40" rx="20" fill="#f1f5f9"/>
  <rect x="190" y="179" width="150" height="10" rx="5" fill="#94a3b8"/>
  <rect x="172" y="214" width="150" height="40" rx="20" fill="#f1f5f9"/>
  <rect x="190" y="229" width="104" height="10" rx="5" fill="#94a3b8"/>
  <rect x="270" y="270" width="188" height="44" rx="22" fill="url(#pill)"/>
  <rect x="292" y="287" width="132" height="10" rx="5" fill="#ffffff" opacity="0.92"/>

  <!-- connector -->
  <g fill="#ffffff">
    <circle cx="530" cy="200" r="6" opacity="0.55"/>
    <circle cx="560" cy="200" r="6" opacity="0.75"/>
    <circle cx="590" cy="200" r="6" opacity="0.9"/>
  </g>
  <g filter="url(#shadow)">
    <circle cx="640" cy="200" r="30" fill="#ffffff"/>
  </g>
  <path d="M627 200 h22 m-9 -9 l10 9 l-10 9" fill="none" stroke="#d62976" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- CRM inbox -->
  <g filter="url(#shadow)">
    <rect x="700" y="52" width="380" height="296" rx="24" fill="#ffffff"/>
  </g>
  <rect x="700" y="52" width="380" height="54" rx="24" fill="#f8fafc"/>
  <rect x="700" y="82" width="380" height="24" fill="#f8fafc"/>
  <circle cx="732" cy="79" r="7" fill="#24d06e"/>
  <rect x="748" y="73" width="110" height="12" rx="6" fill="#1f2937" opacity="0.8"/>
  <rect x="980" y="70" width="76" height="18" rx="9" fill="#e2e8f0"/>

  <!-- highlighted Instagram chat -->
  <rect x="716" y="120" width="348" height="64" rx="14" fill="#fdf2f8"/>
  <circle cx="752" cy="152" r="19" fill="none" stroke="url(#ring)" stroke-width="4"/>
  <circle cx="752" cy="152" r="13" fill="#fce7f3"/>
  <rect x="784" y="138" width="120" height="11" rx="5.5" fill="#1f2937" opacity="0.85"/>
  <rect x="784" y="157" width="178" height="9" rx="4.5" fill="#9ca3af" opacity="0.75"/>
  <rect x="980" y="137" width="68" height="20" rx="10" fill="url(#pill)"/>
  <rect x="992" y="144" width="44" height="6" rx="3" fill="#ffffff" opacity="0.9"/>

  <!-- other chats -->
  <circle cx="752" cy="222" r="16" fill="#dcfce7"/>
  <rect x="784" y="210" width="104" height="10" rx="5" fill="#334155" opacity="0.7"/>
  <rect x="784" y="228" width="160" height="8" rx="4" fill="#cbd5e1"/>
  <line x1="716" y1="252" x2="1064" y2="252" stroke="#f1f5f9" stroke-width="2"/>
  <circle cx="752" cy="284" r="16" fill="#e0e7ff"/>
  <rect x="784" y="272" width="92" height="10" rx="5" fill="#334155" opacity="0.7"/>
  <rect x="784" y="290" width="140" height="8" rx="4" fill="#cbd5e1"/>
  <circle cx="1044" cy="226" r="9" fill="#24d06e"/>
</svg>
